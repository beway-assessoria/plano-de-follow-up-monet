<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Monet — Prospecções da Equipe</title>
<style>
:root{--bg:#0D0F14;--bg2:#13161E;--card:#1E2330;--card2:#242938;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.14);
--gold:#C9A84C;--gold2:#E8C870;--gold-dim:rgba(201,168,76,.14);--teal:#2DD4BF;--teal-dim:rgba(45,212,191,.12);
--red:#F87171;--red-dim:rgba(248,113,113,.12);--green:#4ADE80;--green-dim:rgba(74,222,128,.12);
--blue:#60A5FA;--blue-dim:rgba(96,165,250,.12);--amber:#FBBF24;--amber-dim:rgba(251,191,36,.12);
--purple:#A78BFA;--purple-dim:rgba(167,139,250,.12);--text:#F0F2F7;--text2:#8B92A8;--text3:#555C72}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45;padding-bottom:60px}
.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;background:var(--gold);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#0D0F14;flex-shrink:0}
.tt{font-size:14px;font-weight:700}.ts{font-size:10.5px;color:var(--text2)}
.wrap{max-width:860px;margin:0 auto;padding:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px;letter-spacing:-.02em}.stat span{font-size:9.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.legenda{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.legenda .lt{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
.cbadge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.cbadge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.ct-tor{background:var(--gold-dim);color:var(--gold2)}
.ct-mc{background:var(--teal-dim);color:var(--teal)}
.ct-cen{background:var(--blue-dim);color:var(--blue)}
.ct-sc{background:var(--purple-dim);color:var(--purple)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:var(--card);border:1px solid var(--border);color:var(--text2);padding:8px 13px;border-radius:99px;cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap;font-family:inherit;flex-shrink:0}
.tab small{font-weight:600;opacity:.65;margin-left:3px}
.tab.on{background:var(--gold-dim);border-color:var(--gold);color:var(--gold2)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{background:var(--card);border:1px solid var(--border);color:var(--text2);padding:5px 11px;border-radius:99px;cursor:pointer;font-size:11.5px;font-weight:600;white-space:nowrap;font-family:inherit;flex-shrink:0}
.chip.on{border-color:var(--border2);color:var(--text);background:var(--card2)}
.chip.on.f-quente{background:var(--gold-dim);border-color:var(--gold);color:var(--gold2)}
.chip.on.f-conv{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.busca{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px 13px;font-size:13px;font-family:inherit;outline:none;margin:6px 0 12px}
.busca:focus{border-color:var(--gold)}
.busca::placeholder{color:var(--text3)}
.dia{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin:16px 2px 8px;display:flex;align-items:center;gap:8px}
.dia::after{content:'';flex:1;height:1px;background:var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.card.hot{border-color:rgba(201,168,76,.45);background:linear-gradient(135deg,var(--card),rgba(201,168,76,.05))}
.card.conv{border-color:rgba(74,222,128,.4)}
.c1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:5px}
.emp{font-weight:700;font-size:14px;line-height:1.25}
.kons{font-size:10.5px;color:var(--text3);margin-top:1px}
.bads{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.b-conv{background:var(--green-dim);color:var(--green)}
.b-hot{background:var(--gold-dim);color:var(--gold2)}
.b-ret{background:var(--blue-dim);color:var(--blue)}
.b-sem{background:var(--red-dim);color:var(--red)}
.b-dev{background:var(--amber-dim);color:var(--amber)}
.b-out{background:var(--card2);color:var(--text3)}
.dev{font-size:12.5px;color:var(--text2)}
.fone{display:inline-block;margin-top:6px;font-size:12px;color:var(--teal);text-decoration:none;font-weight:600}
.vazio{text-align:center;color:var(--text3);padding:40px 10px;font-size:13px}
.count{font-size:11px;color:var(--text3);margin:0 2px 8px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}.stat b{font-size:24px}}
</style>
</head>

 "", "v": "Falar com proprietária; oferecer link de pagamento", "c": "Toritama", "cat": "Retornar depois"}, {"d": "14/07/2026", "k": "Gabriela", "e": "Lady Bela", "f": "", "v": "Falar com César (proprietário); usam Ton", "c": "Toritama", "cat": "Retornar depois"}, {"d": "14/07/2026", "k": "Gabriela", "e": "Rei do Terno", "f": "", "v": "Falar com Felipe (gerente)", "c": "Toritama", "cat": "Retornar depois"}, {"d": "14/07/2026", "k": "Allan", "e": "Devore Restaurante", "f": "", "v": "Fechado! Cadastro feito (Thania Maria Brito)", "c": "Santa Cruz", "cat": "Convertido"}];
let selK='all', selCid='all', selCat='all';

const CIDINFO={'Toritama':['ct-tor','Toritama'],'Moda Center':['ct-mc','Moda Center'],'Centro':['ct-cen','Centro (SCC)'],'Santa Cruz':['ct-sc','Santa Cruz']};
const CATB={'Convertido':['b-conv','&#10003; Convertido'],'Quente (quer taxas)':['b-hot','&#128293; Quente'],'Retornar depois':['b-ret','&#8635; Retornar'],'Sem interesse':['b-sem','Sem interesse'],'Sem devolutiva':['b-dev','Sem devolutiva'],'Outros':['b-out','Outros']};
const ORDEMK=['Allan','Renato','Ilma e Sammya','Gabriela','Ilma','Ilma e Giovanna','Giovanna'];
const DESLIG={'Giovanna':true};

function dKey(d){const p=d.split('/');const dia=p[0].includes('\u2013')?p[0].split('\u2013')[1]:p[0];return new Date(+p[2],+p[1]-1,+dia).getTime();}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function fone(f){var s=(''+f).replace(/\D/g,'');if(s.length===11)return'('+s.slice(0,2)+') '+s.slice(2,7)+'-'+s.slice(7);if(s.length===10)return'('+s.slice(0,2)+') '+s.slice(2,6)+'-'+s.slice(6);return f;}

function renderTabs(){
  const counts={};PROSP.forEach(p=>counts[p.k]=(counts[p.k]||0)+1);
  const keys=ORDEMK.filter(k=>counts[k]);
  let h='<button class="tab'+(selK==='all'?' on':'')+'" onclick="setK(\'all\')">Todos <small>'+PROSP.length+'</small></button>';
  h+=keys.map(k=>'<button class="tab'+(selK===k?' on':'')+'" onclick="setK(\''+k+'\')">'+k+(DESLIG[k]?' &#10006;':'')+' <small>'+counts[k]+'</small></button>').join('');
  document.getElementById('tabs').innerHTML=h;
}
function base(){return selK==='all'?PROSP:PROSP.filter(p=>p.k===selK);}
function renderFilters(){
  const b=base();
  const cc={};b.forEach(p=>cc[p.c]=(cc[p.c]||0)+1);
  let h='<button class="chip'+(selCid==='all'?' on':'')+'" onclick="setCid(\'all\')">Todas as regiões</button>';
  ['Toritama','Moda Center','Centro','Santa Cruz'].forEach(c=>{if(cc[c])h+='<button class="chip'+(selCid===c?' on':'')+'" onclick="setCid(\''+c+'\')">'+CIDINFO[c][1]+' ('+cc[c]+')</button>';});
  document.getElementById('f-cid').innerHTML=h;
  const kc={};b.forEach(p=>kc[p.cat]=(kc[p.cat]||0)+1);
  let h2='<button class="chip'+(selCat==='all'?' on':'')+'" onclick="setCat(\'all\')">Todas</button>';
  [['Quente (quer taxas)','f-quente'],['Retornar depois',''],['Convertido','f-conv'],['Sem devolutiva',''],['Sem interesse',''],['Outros','']].forEach(([c,cls])=>{if(kc[c])h2+='<button class="chip '+cls+(selCat===c?' on':'')+'" onclick="setCat(\''+c+'\')">'+CATB[c][1]+' ('+kc[c]+')</button>';});
  document.getElementById('f-cat').innerHTML=h2;
}
function renderStats(){
  const b=base();
  const conv=b.filter(p=>p.cat==='Convertido').length;
  const hot=b.filter(p=>p.cat==='Quente (quer taxas)').length;
  const ret=b.filter(p=>p.cat==='Retornar depois').length;
  document.getElementById('stats').innerHTML=
    '<div class="stat"><b>'+b.length+'</b><span>Visitas</span></div>'+
    '<div class="stat"><b style="color:var(--green)">'+conv+'</b><span>Convertidos</span></div>'+
    '<div class="stat"><b style="color:var(--gold2)">'+hot+'</b><span>Quentes</span></div>'+
    '<div class="stat"><b style="color:var(--blue)">'+ret+'</b><span>P/ retornar</span></div>';
}
function draw(){
  renderTabs();renderFilters();renderStats();
  const q=(document.getElementById('busca').value||'').toLowerCase();
  let rows=base();
  if(selCid!=='all')rows=rows.filter(p=>p.c===selCid);
  if(selCat!=='all')rows=rows.filter(p=>p.cat===selCat);
  if(q)rows=rows.filter(p=>(p.e+' '+p.v+' '+p.k).toLowerCase().includes(q));
  document.getElementById('count').textContent=rows.length+' registro'+(rows.length===1?'':'s');
  // agrupar por dia (desc), quentes/convertidos primeiro dentro do dia
  const byDay={};rows.forEach(p=>{(byDay[p.d]=byDay[p.d]||[]).push(p);});
  const days=Object.keys(byDay).sort((a,b)=>dKey(b)-dKey(a));
  const prio={'Quente (quer taxas)':0,'Convertido':1,'Retornar depois':2,'Sem devolutiva':3,'Outros':4,'Sem interesse':5};
  let h='';
  days.forEach(d=>{
    byDay[d].sort((a,b)=>(prio[a.cat]??9)-(prio[b.cat]??9)||a.e.localeCompare(b.e));
    h+='<div class="dia">'+d+' &middot; '+byDay[d].length+' visitas</div>';
    h+=byDay[d].map(p=>{
      const ci=CIDINFO[p.c]||['ct-sc',p.c];
      const cb=CATB[p.cat]||['b-out',p.cat];
      const hot=p.cat==='Quente (quer taxas)',conv=p.cat==='Convertido';
      return '<div class="card'+(hot?' hot':conv?' conv':'')+'">'+
        '<div class="c1"><div><div class="emp">'+esc(p.e)+'</div><div class="kons">'+esc(p.k)+'</div></div>'+
        '<div class="bads"><span class="badge '+cb[0]+'">'+cb[1]+'</span><span class="cbadge '+ci[0]+'">'+ci[1]+'</span></div></div>'+
        '<div class="dev">'+esc(p.v||'&mdash;')+'</div>'+
        (p.f?'<a class="fone" href="tel:+55'+(''+p.f).replace(/\D/g,'')+'">&#128222; '+fone(p.f)+'</a>':'')+
      '</div>';
    }).join('');
  });
  document.getElementById('lista').innerHTML=h||'<div class="vazio">Nenhum registro com esses filtros.<br/>Limpe a busca ou troque os filtros acima.</div>';
}
function setK(k){selK=k;selCid='all';selCat='all';draw();}
function setCid(c){selCid=c;draw();}
function setCat(c){selCat=c;draw();}
draw();
</script>
